<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" rx="20" fill="#f2f6fa"/><g font-family="Arial,sans-serif" fill="#15304a"><text x="40" y="48" font-size="26" font-weight="bold">A command and its confirmation follow different paths</text><text x="40" y="79" font-size="17">Concept diagram — not an electrical wiring diagram</text><g fill="#fff" stroke="#7390aa" stroke-width="2"><rect x="40" y="119" width="285" height="100" rx="12"/><rect x="408" y="119" width="285" height="100" rx="12"/><rect x="775" y="119" width="285" height="100" rx="12"/><rect x="408" y="275" width="285" height="100" rx="12"/><rect x="40" y="275" width="285" height="100" rx="12"/></g><g font-size="20" text-anchor="middle"><text x="182" y="155">Output request</text><text x="182" y="187">Spindle Tool Release</text><text x="550" y="155">Mapped output</text><text x="550" y="187">Example: DM0.OUT2</text><text x="917" y="155">Valve and mechanism</text><text x="917" y="187">Actual physical action</text><text x="550" y="311">Separate sensor input</text><text x="550" y="343">Example: DM1.IN1</text><text x="182" y="311">Feedback indication</text><text x="182" y="343">Spindle Tool Released</text></g><g fill="none" stroke="#187d85" stroke-width="4"><path d="M330 169 H389 m-14 -9 14 9 -14 9 M698 169 H756 m-14 -9 14 9 -14 9 M917 224 V325 H710 m14 -9 -14 9 14 9 M403 325 H344 m14 -9 -14 9 14 9"/></g><text x="775" y="370" font-size="16">Output On alone does not</text><text x="775" y="393" font-size="16">confirm tool release.</text></g></svg>
