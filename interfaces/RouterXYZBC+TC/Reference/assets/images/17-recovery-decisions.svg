<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-labelledby="title desc"><title id="title">Recovery decision guide</title><desc id="desc">Establish the cause and stop result. For a known ordinary pause, check unchanged setup and retained progress before continuation. For reset, select a reviewed new start. For interrupted preparation or uncertainty, resolve the machine state first. All routes require review before motion.</desc>
<rect width="1080" height="820" fill="#f4f8f9"/><g font-family="Segoe UI,Arial,sans-serif" fill="#173c49"><text x="45" y="53" font-size="29" font-weight="700">Decide what the next movement should be</text><text x="45" y="88" font-size="18">Use the actual machine condition and the command history together.</text></g>
<rect x="180" y="120" width="720" height="95" rx="12" fill="#fff" stroke="#8aadb8" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif" fill="#173c49" font-size="21" text-anchor="middle"><text x="540" y="158" font-weight="700">Resolve the cause and establish the stop result</text><text x="540" y="191">Emergency or uncertain condition? Follow approved recovery first.</text></g>
<path d="M540 216v33H195v28M540 249v28M540 249h345v28" fill="none" stroke="#186577" stroke-width="3"/>
<g fill="#fff" stroke="#b4cbd2" stroke-width="2"><rect x="40" y="277" width="310" height="263" rx="12"/><rect x="385" y="277" width="310" height="263" rx="12"/><rect x="730" y="277" width="310" height="263" rx="12"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173c49" font-size="19"><text x="62" y="316" font-size="22" font-weight="700">Known ordinary Pause</text><text x="62" y="360">Cursor retained?</text><text x="62" y="392">Setup still valid?</text><text x="62" y="424">Equipment ready?</text><text x="62" y="469">Review return route,</text><text x="62" y="500">then ordinary continuation.</text>
<text x="407" y="316" font-size="22" font-weight="700">Reset completed</text><text x="407" y="360">Old progress reset.</text><text x="407" y="392">Assess partially cut work.</text><text x="407" y="437">Choose a reviewed fresh</text><text x="407" y="469">start or approved</text><text x="407" y="500">selected-line entry.</text>
<text x="752" y="316" font-size="22" font-weight="700">Preparation interrupted</text><text x="752" y="360">Tool or position uncertain?</text><text x="752" y="392">Continuation cancelled?</text><text x="752" y="437">Resolve the physical state</text><text x="752" y="469">and confirmations before</text><text x="752" y="500">choosing a start.</text></g>
<path d="M195 541v34H885v-34M540 575v30" fill="none" stroke="#186577" stroke-width="3"/>
<rect x="180" y="605" width="720" height="96" rx="12" fill="#e2eff0" stroke="#186577" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif" fill="#173c49" font-size="21" text-anchor="middle"><text x="540" y="644" font-weight="700">Know the next route, tool and equipment state</text><text x="540" y="677">Request the approved operation and observe its result.</text></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#49616b" font-size="18"><text x="45" y="755">Zero feed is a separate active-path condition: raising it can resume movement.</text><text x="45" y="785">Concept guide only. It does not authorize access or replace machine-specific recovery.</text></g></svg>
