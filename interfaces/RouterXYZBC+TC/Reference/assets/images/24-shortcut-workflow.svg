<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340"><rect width="1100" height="340" rx="20" fill="#f2f6fa"/><g font-family="Arial,sans-serif" fill="#15304a"><text x="35" y="48" font-size="26" font-weight="bold">From captured keys to a verified assignment</text><text x="35" y="80" font-size="17">The shortcut editor records keys; it does not execute the selected command.</text><g fill="white" stroke="#7390aa" stroke-width="2"><rect x="35" y="120" width="225" height="105" rx="12"/><rect x="300" y="120" width="225" height="105" rx="12"/><rect x="565" y="120" width="225" height="105" rx="12"/><rect x="830" y="120" width="235" height="105" rx="12"/></g><g text-anchor="middle"><g font-size="21" font-weight="bold"><text x="147" y="156">Capture</text><text x="412" y="156">Review</text><text x="677" y="156">Assign</text><text x="947" y="156">Accept and verify</text></g><g font-size="17"><text x="147" y="188">Candidate only</text><text x="412" y="188">Command + conflicts</text><text x="677" y="188">Working value changes</text><text x="947" y="188">Save, then test deliberately</text></g></g><g stroke="#187d85" stroke-width="3" fill="none"><path d="M265 172 H290 m-9 -7 9 7 -9 7 M530 172 H555 m-9 -7 9 7 -9 7 M795 172 H820 m-9 -7 9 7 -9 7"/></g><text x="35" y="277" font-size="18">Esc in the capture field abandons a candidate. Remove clears the assigned shortcut.</text><text x="35" y="308" font-size="18">A command can run only when its normal availability and access conditions allow it.</text></g></svg>
