<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc"><title id="title">From edited draft to a reviewed job</title><desc id="desc">Review draft, save to original file, reopen and prepare, inspect revised job, then separately request Run. A save failure needs file verification; preparation rejection does not undo the successful save.</desc><rect width="1080" height="680" fill="#f4f8f9"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173c49"><text x="45" y="52" font-size="29" font-weight="700">Saving and accepting the job are separate steps</text><text x="45" y="87" font-size="18">A successful write changes the original file before preparation is checked.</text></g>
<g fill="#fff" stroke="#abc4cc" stroke-width="2"><rect x="45" y="125" width="615" height="70" rx="10"/><rect x="45" y="224" width="615" height="70" rx="10"/><rect x="45" y="323" width="615" height="70" rx="10"/><rect x="45" y="422" width="615" height="70" rx="10"/><rect x="45" y="521" width="615" height="70" rx="10"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173c49" font-size="21"><text x="68" y="168">1. Review the approved correction in the draft</text><text x="68" y="267">2. Save the complete text to the original path</text><text x="68" y="366">3. Reopen and prepare the revised file</text><text x="68" y="465">4. Inspect diagnostics, path and physical setup</text><text x="68" y="564">5. Request Run separately when ready</text></g>
<path d="M353 196v20m-6-6 6 6 6-6M353 295v20m-6-6 6 6 6-6M353 394v20m-6-6 6 6 6-6M353 493v20m-6-6 6 6 6-6" fill="none" stroke="#186577" stroke-width="3"/>
<rect x="704" y="224" width="330" height="268" rx="12" fill="#fff3df" stroke="#d2b781"/><g font-family="Segoe UI,Arial,sans-serif" fill="#654d29" font-size="19"><text x="727" y="262" font-weight="700">If a stage fails</text><text x="727" y="305">Write failure:</text><text x="727" y="333">verify the disk file.</text><text x="727" y="379">Preparation rejection:</text><text x="727" y="407">the successful save</text><text x="727" y="435">has already changed the file.</text><text x="727" y="471">Correct or restore, then review.</text></g>
<text x="45" y="636" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#49616b">Concept diagram only. Save does not start motion or certify the actual workpiece setup.</text></svg>
