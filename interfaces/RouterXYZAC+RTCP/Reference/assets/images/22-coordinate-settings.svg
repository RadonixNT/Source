<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="t d"><title id="t">Different coordinate-related settings serve different purposes</title><desc id="d">Machine calibration, machine-coordinate destinations, work references and live adjustments require separate checks. Similar numeric values are not interchangeable.</desc><rect width="1080" height="600" fill="#f5f8f9"/><g font-family="Segoe UI,Arial,sans-serif" fill="#193f4b"><text x="40" y="49" font-size="28" font-weight="700">Identify what the number describes before changing it</text><text x="40" y="87" font-size="20">These values can all use millimetres, but they answer different questions.</text><g fill="#fff" stroke="#a1c2cd"><rect x="40" y="123" width="480" height="175" rx="12"/><rect x="560" y="123" width="480" height="175" rx="12"/><rect x="40" y="324" width="480" height="175" rx="12"/><rect x="560" y="324" width="480" height="175" rx="12"/></g><g font-size="23" font-weight="700"><text x="62" y="163">Machine calibration and Home</text><text x="582" y="163">Machine-coordinate destinations</text><text x="62" y="364">Work references: G54–G59</text><text x="582" y="364">Live adjustment</text></g><g font-size="20"><text x="62" y="207">How does the controller establish</text><text x="62" y="237">and interpret machine position?</text><text x="62" y="277">Examples: Step, HomePosition</text><text x="582" y="207">Where is a machine operation</text><text x="582" y="237">intended to go?</text><text x="582" y="277">Examples: Park Position</text><text x="62" y="408">Where is the job origin placed</text><text x="62" y="438">relative to the machine?</text><text x="62" y="478">Check the selected row and real stock.</text><text x="582" y="408">What correction belongs to</text><text x="582" y="438">a fine adjustment?</text><text x="582" y="478">Check Length and XYZ Offset.</text></g><text x="40" y="550" font-size="19" fill="#526b78">Concept diagram. A correction in one category is not a substitute for checking another.</text></g></svg>
