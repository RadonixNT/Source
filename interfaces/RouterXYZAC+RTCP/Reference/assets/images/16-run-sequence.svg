<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
<title id="title">An accepted start can pass through preparation before machining</title><desc id="desc">Run request followed by start checks, positioning when needed, and main program execution. A rejection or cancellation requires state review. Not every job uses every preparation stage.</desc>
<rect width="1080" height="680" fill="#f4f8f9"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173c49"><text x="50" y="56" font-size="28" font-weight="700">From Run to machining</text><text x="50" y="88" font-size="18">An operator's sequence — stages depend on the job and machine state</text></g>
<g fill="#fff" stroke="#b4cbd2" stroke-width="2"><rect x="50" y="128" width="630" height="70" rx="10"/><rect x="50" y="224" width="630" height="70" rx="10"/><rect x="50" y="320" width="630" height="70" rx="10"/><rect x="50" y="416" width="630" height="70" rx="10"/><rect x="50" y="512" width="630" height="70" rx="10"/></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173c49" font-size="20"><text x="75" y="171">1. Request Run after completing the setup checks</text><text x="75" y="267">2. Check start intent and machine readiness</text><text x="75" y="363">3. Resolve the program entry</text><text x="75" y="459">4. Position for entry, when needed</text><text x="75" y="555">5. Execute and monitor the main program</text></g>
<g stroke="#186577" stroke-width="3" fill="#186577"><path d="M365 199v16m-6-6 6 6 6-6M365 295v16m-6-6 6 6 6-6M365 391v16m-6-6 6 6 6-6M365 487v16m-6-6 6 6 6-6" fill="none"/></g>
<rect x="720" y="224" width="310" height="263" rx="12" fill="#fff3df" stroke="#d4b57c"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#654d29" font-size="19"><text x="745" y="260" font-weight="700">Keep checking the result</text><text x="745" y="300">Accepted does not mean</text><text x="745" y="327">completed.</text><text x="745" y="371">After rejection, cancellation</text><text x="745" y="398">or an unexpected stop:</text><text x="745" y="442">review the actual state</text><text x="745" y="469">before another request.</text></g>
<text x="50" y="632" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#49616b">Concept diagram only. It is not a screenshot or a clearance model of your machine.</text></svg>
