<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Main-window orientation map</title><desc id="desc">Simplified map based on the reviewed layout. Status spans the top. Preview is left, position readouts upper right, references middle right, jog lower right, program and spindle controls lower left and centre. File controls, status and Settings are at the bottom. Not a screenshot.</desc>
<rect width="1000" height="660" fill="#f3f7f7"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#22313a"><text x="30" y="42" font-size="27" font-weight="700">Where to look on the main screen</text><text x="30" y="72" font-size="17">Orientation only — simplified groups, not a screenshot or clickable controls.</text>
