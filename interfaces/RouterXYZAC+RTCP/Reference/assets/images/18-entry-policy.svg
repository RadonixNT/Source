<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc"><title id="title">Requested line and resolved entry</title><desc id="desc">Illustrative rows: 80 comment, 81 rapid move, 82 equipment action, 83 accepted cutting movement. With cutting-entry mode off, the requested comment resolves to the next executable instruction at row 81. With it on, entry resolves to row 83. Required preparation can precede either entry.</desc><rect width="1080" height="590" fill="#f4f8f9"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173c49"><text x="45" y="52" font-size="28" font-weight="700">One requested row, two entry policies</text><text x="45" y="86" font-size="18">Illustration only — these rows are descriptions, not a machine program.</text></g>
<g fill="#fff" stroke="#a9c4cc" stroke-width="2"><rect x="45" y="125" width="480" height="66" rx="8"/><rect x="45" y="209" width="480" height="66" rx="8"/><rect x="45" y="293" width="480" height="66" rx="8"/><rect x="45" y="377" width="480" height="66" rx="8"/></g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#173c49"><text x="65" y="166">80   Comment — requested row</text><text x="65" y="250">81   Rapid movement</text><text x="65" y="334">82   Equipment action</text><text x="65" y="418">83   Accepted cutting movement</text></g>
<path d="M530 242h57m-9-7 9 7-9 7M530 410h57m-9-7 9 7-9 7" fill="none" stroke="#186577" stroke-width="3"/>
<rect x="605" y="191" width="430" height="107" rx="10" fill="#e2eff0"/><rect x="605" y="357" width="430" height="107" rx="10" fill="#e2eff0"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173c49" font-size="19"><text x="625" y="225" font-weight="700">Next-cutting-entry option OFF</text><text x="625" y="255">Resolve the next executable instruction:</text><text x="625" y="283">row 81 in this example.</text><text x="625" y="391" font-weight="700">Next-cutting-entry option ON</text><text x="625" y="421">Resolve the accepted cutting entry:</text><text x="625" y="449">row 83 in this example.</text></g>
<g font-family="Segoe UI,Arial,sans-serif" fill="#49616b" font-size="19"><text x="45" y="514">Required equipment state and positioning can precede the resolved entry.</text><text x="45" y="549">Selection is not execution, and omitted rows are not proof of completed physical work.</text></g></svg>
