<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="355" viewBox="0 0 1100 355"><rect width="1100" height="355" rx="20" fill="#f2f6fa"/><g font-family="Arial,sans-serif" fill="#15304a"><text x="35" y="47" font-size="26" font-weight="bold">Two different results: accepted access and a saved password</text><g fill="white" stroke="#7390aa" stroke-width="2"><rect x="35" y="85" width="480" height="210" rx="12"/><rect x="550" y="85" width="515" height="210" rx="12"/></g><g font-size="22" font-weight="bold"><text x="60" y="125">Access prompt → Open</text><text x="575" y="125">Passwords form → Save</text></g><g font-size="19"><text x="60" y="165">Checks the existing local credential.</text><text x="60" y="202">Successful access lasts for the session.</text><text x="60" y="239">Closing Settings does not sign out.</text><text x="575" y="165">Replaces the selected account credential.</text><text x="575" y="202">A successful save is persistent.</text><text x="575" y="239">Settings Cancel does not restore it.</text></g><text x="35" y="329" font-size="18">Neither action confirms machine readiness or removes the normal operating checks.</text></g></svg>
