<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
<title id="title">How the supplied spindle stopped qualification works</title><desc id="desc">Remove both run requests, allow Spindle Off Time, then require one second with no configured rotation sensor edge. Sensor edges restart the quiet interval. This is a logic sequence, not a measured speed curve.</desc>
<rect width="1100" height="480" fill="#f7fafb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173e4b">
<text x="550" y="42" text-anchor="middle" font-size="25" font-weight="700">From stop request to qualified stopped status</text>
<rect x="35" y="100" width="250" height="155" rx="12" fill="#e6f1f3" stroke="#8eafb7"/>
<rect x="325" y="100" width="325" height="155" rx="12" fill="#e6f1f3" stroke="#8eafb7"/>
<rect x="690" y="100" width="375" height="155" rx="12" fill="#e6f1f3" stroke="#8eafb7"/>
<text x="160" y="134" text-anchor="middle" font-size="21" font-weight="700">1 · Run requests off</text>
<text x="160" y="175" text-anchor="middle" font-size="18">Both directions off</text><text x="160" y="207" text-anchor="middle" font-size="18">M5 also clears speed</text>
<text x="487" y="134" text-anchor="middle" font-size="21" font-weight="700">2 · Deceleration interval</text>
<text x="487" y="175" text-anchor="middle" font-size="18">Configured Spindle Off Time</text><text x="487" y="207" text-anchor="middle" font-size="18">No shaft-speed measurement</text>
<text x="877" y="134" text-anchor="middle" font-size="21" font-weight="700">3 · Complete quiet interval</text>
<text x="877" y="175" text-anchor="middle" font-size="18">1,000 ms with no sensor edge</text><text x="877" y="207" text-anchor="middle" font-size="18">An edge restarts this interval</text>
<path d="M287 180H317M652 180H682" stroke="#316f7c" stroke-width="4"/><path d="M308 174L319 180L308 186M673 174L684 180L673 186" fill="none" stroke="#316f7c" stroke-width="4"/>
<text x="550" y="309" text-anchor="middle" font-size="20">If no physical rotation sensor is assigned, qualification uses the delays alone.</text>
<text x="550" y="350" text-anchor="middle" font-size="20">An unsuccessful program stop can time out; it must not be treated as confirmation.</text>
<text x="550" y="408" text-anchor="middle" font-size="19" font-weight="700">Qualified status does not replace the machine's physical-access procedure.</text>
<text x="550" y="448" text-anchor="middle" font-size="17" fill="#576e77">Conceptual sequence, not a speed graph. Required output configuration and no run request remain necessary.</text>
</g></svg>
