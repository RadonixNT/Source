<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
<title id="title">Roller orientation and the axis used for offsets</title><desc id="desc">Two plan views. With On-Bridge Axis X, rollers run parallel to X and their displacement from the spindle is measured along Y. With On-Bridge Axis Y, rollers run parallel to Y and displacement is measured along X. Positive directions are illustrative.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#155765"/></marker></defs>
<rect width="1120" height="580" fill="#f7fafb"/>
<g font-family="Arial, sans-serif" fill="#203943"><text x="40" y="42" font-size="25" font-weight="bold">Orientation selects the offset axis</text><text x="40" y="70" font-size="17">Conceptual top views • illustrative axis directions • not a machine drawing</text>
<rect x="30" y="96" width="520" height="390" rx="10" fill="white" stroke="#bdcdd2"/><rect x="570" y="96" width="520" height="390" rx="10" fill="white" stroke="#bdcdd2"/>
<text x="55" y="132" font-size="21" font-weight="bold">On-Bridge Axis = X</text><text x="595" y="132" font-size="21" font-weight="bold">On-Bridge Axis = Y</text>
<g stroke="#155765" stroke-width="3" marker-end="url(#arrow)"><path d="M75 412H195"/><path d="M75 412V305"/><path d="M615 412H735"/><path d="M615 412V305"/></g>
<g font-size="18"><text x="201" y="419">+X</text><text x="60" y="292">+Y</text><text x="741" y="419">+X</text><text x="600" y="292">+Y</text></g>
<g fill="#d6e9e9" stroke="#155765" stroke-width="2"><rect x="220" y="195" width="260" height="22" rx="9"/><rect x="220" y="357" width="260" height="22" rx="9"/><rect x="775" y="182" width="22" height="195" rx="9"/><rect x="993" y="182" width="22" height="195" rx="9"/></g>
<g fill="#b57432"><circle cx="350" cy="287" r="15"/><circle cx="895" cy="287" r="15"/></g>
<g font-size="17"><text x="311" y="321">Spindle</text><text x="858" y="327">Spindle</text><text x="268" y="179">Rollers parallel to X</text><text x="767" y="165">Rollers parallel to Y</text></g>
<g stroke="#155765" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M420 282V222"/><path d="M818 270H873"/></g>
<g font-size="17" fill="#155765"><text x="439" y="254">Y</text><text x="835" y="253">X</text></g>
<g font-size="19" font-weight="bold"><text x="221" y="450">Use Y offsets and Y limits</text><text x="761" y="450">Use X offsets and X limits</text></g>
<text x="40" y="526" font-size="18">Offset sign follows the selected axis: roller position minus spindle position.</text><text x="40" y="554" font-size="18">Changing this setting retains the numbers. It does not move or recalibrate the rollers.</text></g></svg>
